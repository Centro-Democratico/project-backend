version: '3.9'

services:

  db:
    image: postgres:16
    container_name: benchmark_db
    restart: always

    environment:
      POSTGRES_USER: benchmark_user
      POSTGRES_PASSWORD: 179512
      POSTGRES_DB: benchmark_db

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  postgres_data: